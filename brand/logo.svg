<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- subtle grid/node lines suggesting automation & data -->
  <g stroke="#1E293B" stroke-width="2" opacity="0.6">
    <line x1="96" y1="176" x2="96" y2="336"/>
    <line x1="416" y1="176" x2="416" y2="336"/>
  </g>

  <!-- M monogram built from angular strokes (network/graph style) -->
  <g fill="none" stroke="url(#mint)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 340 L96 172 L256 300 L416 172 L416 340"/>
  </g>

  <!-- node dots at the peaks -> data / automation nodes -->
  <circle cx="96" cy="172" r="16" fill="#5EEAD4"/>
  <circle cx="256" cy="300" r="18" fill="#F0FDFA"/>
  <circle cx="416" cy="172" r="16" fill="#5EEAD4"/>
  <circle cx="96" cy="340" r="12" fill="#2DD4BF" opacity="0.9"/>
  <circle cx="416" cy="340" r="12" fill="#2DD4BF" opacity="0.9"/>
</svg>
